name: Bug checker (Legacy)

on:
  schedule:
    - cron: '0 16 14 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@main
      - name: Set up Python 3.10
        uses: actions/setup-python@main
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check bug templates (Legacy)
        run: |
          # python checker-legacy.py "${{ secrets.OWNER_PASSWORD }}"
          python checker-legacy.py "${{ secrets.BOT_PASSWORD }}"
      - name: Get date
        run: |
          echo "CURRENT_DATE=$(date '+%Y-%m-%d UTC')" >> $GITHUB_ENV
      - name: Commit
        uses: EndBug/add-and-commit@main
        with:
          default_author: github_actions
          message: "Update ${{env.CURRENT_DATE}}"
