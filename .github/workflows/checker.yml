name: Bug checker

on:
  schedule:
    - cron: '0 16 8-14 * *'
  workflow_dispatch:

jobs:
  condition:
    runs-on: ubuntu-latest
    outputs:
      day: ${{ steps.day.outputs.day }}
    steps:
      - name: Day of the week
        id: day
        run: echo "day=$(date +%u)" >> $GITHUB_OUTPUT

  checker:
    runs-on: ubuntu-latest
    needs: condition
    if: needs.condition.outputs.day == 6 || github.event_name == 'workflow_dispatch'
    env:
      BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
      OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
    steps:
      - uses: actions/checkout@main
      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check bug templates
        run: |
          python checker.py
          echo "CURRENT_DATE=$(date '+%Y-%m-%d UTC')" >> $GITHUB_ENV
      - name: Commit & Push
        uses: EndBug/add-and-commit@main
        with:
          default_author: github_actions
          message: "Update ${{env.CURRENT_DATE}}"
