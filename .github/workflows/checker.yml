name: Bug checker

on:
  schedule:
    - cron: 0 16 * * 6
  workflow_dispatch:

jobs:
  condition:
    runs-on: ubuntu-latest
    outputs:
      pass: ${{ steps.check.outputs.pass }}
    steps:
      - name: Day of the month
        id: check
        run: |
          day=$(date +%-d)
          pass=1
          echo "Today is Day $day of the month."
          if [[ $day -gt 7 && $day -lt 15 ]]; then
            pass=0
          fi
          if [ ${{ github.event_name }} == workflow_dispatch ]; then
            pass=0
          fi
          echo "pass=$pass" >> $GITHUB_OUTPUT

  checker:
    runs-on: ubuntu-latest
    needs: condition
    if: needs.condition.outputs.pass == 0
    env:
      WIKI_USERAGENT: ${{ secrets.WIKI_USERAGENT }}
      WIKI_BOT_USERNAME: ${{ secrets.WIKI_BOT_USERNAME }}
      WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD }}
      SDJIRA_ACCOUNT_EMAIL: ${{ secrets.SDJIRA_ACCOUNT_EMAIL }}
      SDJIRA_ACCOUNT_PASSWORD: ${{ secrets.SDJIRA_ACCOUNT_PASSWORD }}
      CURRENT_DATE: ""
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v8
        with:
          python-version: 3.12
      - name: Install dependencies
        run: uv sync
      - name: Check bug templates
        run: |
          uv run checker.py
          echo "CURRENT_DATE=$(date '+%Y-%m-%d UTC')" >> $GITHUB_ENV
      - name: Commit & Push
        uses: EndBug/add-and-commit@v10
        with:
          default_author: github_actions
          message: Update ${{ env.CURRENT_DATE }}
